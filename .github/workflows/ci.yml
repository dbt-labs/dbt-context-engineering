name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # enables the opt-in live-battery job below

jobs:
  # Structure-only gate (DECISIONS.md D6): parse each integration-test project across all three
  # dialects. `dbt parse` renders the wrapper dispatch (bigquery__/snowflake__/databricks__ impls)
  # and validates refs/macros/config WITHOUT opening a warehouse connection — so no credentials are
  # needed. (compile is NOT used here: it connects at startup on every cloud adapter.)
  structure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [snowflake, databricks, bigquery]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt for ${{ matrix.adapter }}
        run: pip install "dbt-${{ matrix.adapter }}"
      - name: deps
        run: dbt deps --project-dir integration_tests/${{ matrix.adapter }} --profiles-dir ci
      - name: parse (renders wrapper dispatch; no warehouse connection)
        run: dbt parse --project-dir integration_tests/${{ matrix.adapter }} --profiles-dir ci

  # Deterministic tests (chunking, guard, log) — executed on duckdb, no warehouse credentials
  # needed (DECISIONS.md D6). This is the only job that truly compiles + runs + tests models.
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt-duckdb
        run: pip install dbt-duckdb
      - name: deps
        run: dbt deps --project-dir integration_tests/duckdb --profiles-dir integration_tests/duckdb
      - name: build + test (duckdb)
        # duckdb resolves the profile's relative `path:` against the CWD (repo root), and it
        # won't create missing parent dirs — so ensure target/ exists on a clean checkout.
        run: |
          mkdir -p target
          dbt build --project-dir integration_tests/duckdb --profiles-dir integration_tests/duckdb
      - name: circuit breaker trips over ceiling (expect FAILURE)
        # ce_guard_batch must RAISE when a batch exceeds the ceiling. Rebuild the guarded model with
        # a ceiling below the 10-row fixture and assert dbt exits non-zero. Inverts the exit code so
        # a guard that FAILS to trip fails the job.
        run: |
          if dbt build --project-dir integration_tests/duckdb --profiles-dir integration_tests/duckdb \
               --select ce_guard_pass --vars '{ce_max_batch_rows: 3}'; then
            echo "::error::ce_guard_batch did NOT trip over the ceiling"; exit 1
          else
            echo "ce_guard_batch tripped as expected (non-zero exit)"
          fi
      - name: version guard sequence — delta + version bump (duckdb)
        # ce_version_guard only shows its behavior across SEQUENTIAL runs. The main build above
        # already built ce_versioned at v1 (full-refresh). Run 2 keeps v1 -> the delta filter runs
        # (no new rows); run 3 bumps to v2 -> the guard reprocesses ALL rows and the unique_key merge
        # replaces them. assert_versioned (parameterized by ce_test_version) proves each state.
        run: |
          dbt build --project-dir integration_tests/duckdb --profiles-dir integration_tests/duckdb \
            --select ce_versioned assert_versioned --vars '{ce_test_version: v1}'
          dbt build --project-dir integration_tests/duckdb --profiles-dir integration_tests/duckdb \
            --select ce_versioned assert_versioned --vars '{ce_test_version: v2}'

  # Live battery — OPT-IN (manual `workflow_dispatch` only; never runs on PR/push). Runs the full
  # integration battery against real warehouses for all three adapters. Requires a repo secret
  # DBT_PROFILES_YML holding the three profiles (jaffle-mcp-demo, bigquery, databricks). Every model
  # is a plain table — no vector indexes or serving endpoints are created (search is brute-force).
  live-battery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [snowflake, databricks, bigquery]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt for ${{ matrix.adapter }}
        run: pip install "dbt-${{ matrix.adapter }}"
      - name: Write profiles from secret
        run: |
          mkdir -p ~/.dbt
          printf '%s' "${{ secrets.DBT_PROFILES_YML }}" > ~/.dbt/profiles.yml
      - name: deps
        run: dbt deps --project-dir integration_tests/${{ matrix.adapter }}
      - name: build battery (full-refresh)
        run: dbt build --project-dir integration_tests/${{ matrix.adapter }} --full-refresh
      - name: version guard sequence — delta + version bump (real warehouse)
        # Sequential runs to exercise ce_version_guard's delta vs. reprocess-all paths on the real
        # warehouse (the full-refresh build above only covers the first build). v1 again = delta;
        # v2 = version bump = reprocess all. Selected by tag so it works across adapters.
        run: |
          dbt build --project-dir integration_tests/${{ matrix.adapter }} \
            --select tag:version_guard --vars '{ce_test_version: v1}'
          dbt build --project-dir integration_tests/${{ matrix.adapter }} \
            --select tag:version_guard --vars '{ce_test_version: v2}'
