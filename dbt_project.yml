name: 'dbt_context_engineering'
version: '0.1.0'
config-version: 2

# A cross-platform dbt package for context engineering — modeling data that AI agents
# read — across Snowflake (Cortex), Databricks, and BigQuery.

require-dbt-version: [">=1.11.0", "<3.0.0"]

profile: 'dbt_context_engineering'

macro-paths: ["macros", "prompts"]  # prompts are versioned Jinja macros (ADR-0001)
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Configuration surface (spec §8). All divergent prerequisites live here,
# visible and documented — never inferred. Override per project or per call.
# ---------------------------------------------------------------------------
vars:
  # Default model per function (override per call at the wrapper).
  # Model choice is the single largest cost lever — always explicit, always logged.
  model_generate: null      # e.g. snowflake: 'claude-3-5-sonnet'; set per adapter/project
  model_classify: null
  model_extract: null

  # Embeddings — pinned. A corpus embedded by one model cannot be searched by another.
  embedding_model: null

  # Chunking (chunk, Phase 1). Token heuristic is ceil(char_length/4); no AI call.
  # target = best-practice sweet spot (~512); overlap opt-in (0 = clean partition).
  chunk_target_tokens: 512
  chunk_overlap_tokens: 0

  # Circuit breaker ceilings (guard_batch, Phase 2). Guards the INPUT relation only.
  max_batch_rows: 10000
  max_est_tokens: 5000000

  # Dev-mode row sampling (dev_sample_filter, macros/cost/). null => no sampling, full corpus.
  # A dev-experience convenience keeping a dev/CI run far below the ceilings above, not a
  # spend-safety mechanism itself (that's guard_batch/ai_functions_enabled's job) and not
  # something any model applies unless it calls dev_sample_filter() itself.
  ai_sample_rows: null      # e.g. 50

  # OUTPUT-side cost control. The guard above only bounds INPUT tokens, so it cannot catch an
  # output blowup. null => vendor default (nothing emitted).
  #   max_output_tokens — cross-engine response cap. Snowflake AI_COMPLETE `max_tokens`,
  #     Databricks ai_query `max_tokens`, BigQuery `maxOutputTokens`. Applies to generate on all
  #     three; on Snowflake/Databricks classify & extract expose no cap (bounded by output_schema).
  #   bq_thinking_budget — BigQuery/Gemini ONLY. Gemini 2.5 runs DYNAMIC THINKING ON BY DEFAULT
  #     and bills thinking as OUTPUT tokens; set 0 for structured tasks to stop paying for it.
  max_output_tokens: null      # e.g. 1024
  bq_thinking_budget: null     # 0 disables Gemini thinking; null => model default

  # Cost logging (log_ai_run, Phase 3). Price per 1k tokens for est_cost; null => est_cost
  # left null.
  cost_per_1k_tokens: null

  # BigQuery ONLY — required. A MODEL over a Vertex AI connection must exist before calls
  # run. This is a setup step, never auto-created inside a model build.
  bq_connection: null       # e.g. 'us.my_vertex_connection'
  bq_model: null            # e.g. 'my_dataset.my_remote_model'

  # Where the append-only AI run log is written (Phase 3).
  ai_run_log_relation: null

  # Off by default so a fresh/CI target can never accidentally trigger a real, billed AI call.
  # require_ai_functions_enabled() (macros/functions/require_prerequisites.sql) raises a
  # compiler error naming this var when it is not explicitly set true; called from
  # generate/classify/extract/embed/ai_agg's own dispatch, so calling any of them unavoidably
  # runs the check. create_ai_run_log_table() (macros/audit/) checks this var too, for a
  # different reason: it decides whether an on-run-start bootstrap is worth doing at all this
  # invocation, not whether an AI call is safe to make.
  ai_functions_enabled: false

  # embedding_canary (runtime drift monitor, ADR-0026). Minimum cosine similarity a live probe
  # must retain against its blessed baseline. The same measure vector_search already uses to rank
  # results (ADR-0005): a threshold here means "would this difference change a search result,"
  # not an arbitrary count of float decimal places. Live measurement found the same probe embedded
  # across separate connections lands on a small number of exact repeating vectors (not continuous
  # jitter), scoring 0.999999-0.9999994 similarity against each other; 0.999 is a safety margin
  # below that floor, not a value tuned to any observed real drift (none has been observed).
  embedding_canary_similarity_threshold: 0.999
  # Snowflake ONLY -- required when embedding_canary runs there. VECTOR's dimension is part of its
  # type and Snowflake requires a literal there (confirmed live: a dynamic dimension expression is
  # a syntax error), so the baseline's parsed-from-JSON vector needs this to know its own shape.
  # Defaults to 768, snowflake-arctic-embed-m-v1.5's output dimension, so the package parses with
  # no setup. Override to match your embedding_model's actual output dimension if it differs --
  # embedding_fn_fingerprint (keyed on embedding_model, not dimension) already excludes stale
  # baseline rows on any model change, so a mismatched value here surfaces as a cast error rather
  # than a silently wrong comparison.
  embedding_canary_vector_dimension: 768
  # warn in prod (a benign wobble should not fail a scheduled build); CI overrides this to
  # 'error' so a PR cannot merge past real drift.
  embedding_canary_test_severity: warn

models:
  dbt_context_engineering:
    audit:
      +materialized: table
    # embedding_canary (ADR-0026) makes real embed() calls, real cost, on every build it's part
    # of. Disabled by default so installing this package adds no automatic per-build spend; a
    # consumer opts in with `monitoring: +enabled: true` and wires it into their own scheduled
    # production job specifically (see README), not their default/dev build command, since the
    # canary only catches provider drift by comparing runs spaced apart in time.
    monitoring:
      +enabled: false

seeds:
  dbt_context_engineering:
    +quote_columns: false
    # embedding_canary_baseline is the only seed this package ships (integration-test fixtures
    # live in integration_tests/*/seeds, not here). Disabled by default so a consumer's `dbt
    # build`/`dbt seed` never writes it unless they've opted into monitoring — pair with
    # `monitoring: +enabled: true` above.
    +enabled: false
