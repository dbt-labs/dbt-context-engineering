name: 'bigquery_tests'
version: '1.0.0'
config-version: 2

# Live BigQuery integration test. Uses the user's ~/.dbt profile 'bigquery'.
# RUNS REAL AI CALLS (small cost) once the AI models execute.
profile: 'bigquery'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # BigQuery AI.* endpoints (adjust per project availability).
  model_generate: 'gemini-2.5-flash'
  embedding_model: 'text-embedding-005'
  chunk_target_tokens: 512
  chunk_overlap_tokens: 0
  # bq_connection: left unset — try the service-account / default path first.
  # Output-side cost control — the 65,825-token generate run was ~6,500 output tokens/row of
  # Gemini 2.5 Flash thinking. Disable thinking and cap the response for these structured tasks.
  bq_thinking_budget: 0
  max_output_tokens: 1024

models:
  dbt_context_engineering:
    +enabled: false
    audit:
      +enabled: true
