version: 2

models:
  - name: chunk_metadata_cols_bq
    description: "attach_metadata over chunk_docs_bq (default in_text=False) — title/citation_url pass through as columns only."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: chunk_metadata_text_bq
    description: "attach_metadata over chunk_docs_bq with in_text=True — same columns, plus the block prepended to chunk_text."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: chunk_metadata_utterances_bq
    description: "attach_metadata over chunk_utterances_bq (transcripts), same macro and call shape as the docs models, pointed at a structurally different source."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: customer
        tests: [not_null]
      - name: participants
        tests: [not_null]
      - name: recording_url
        tests: [not_null]
