version: 2

models:
  - name: orphan_chunks
    description: >
      chunk output over the synthetic transcript seed, var-driven target_tokens (oc_target_tokens)
      so it can be rebuilt with a different chunking config to simulate a re-chunk. See
      orphan_embeddings and ADR-0023's chunk_id orphaning discussion.

    columns:
      - name: chunk_id
        tests: [unique, not_null]

  - name: orphan_embeddings
    description: >
      Stand-in downstream "embedding" model keyed on chunk_id. The relationships test below proves
      a chunk_id that orphan_chunks stops producing after a re-chunk is a loud, testable
      failure rather than a silent, permanent gap in this table.
    columns:
      - name: chunk_id
        tests:
          - relationships:
              arguments:
                to: ref('orphan_chunks')
                field: chunk_id

  - name: chunk_metadata_cols
    description: "attach_metadata over chunk_docs (default in_text=False) — title/citation_url pass through as columns only."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: chunk_metadata_text
    description: "attach_metadata over chunk_docs with in_text=True — same columns, plus the block prepended to chunk_text."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: amd_null_meta_source
    description: "Metadata edge-case fixture, joined against chunk_docs' real partition keys: doc_1 real values (baseline), doc_2 two rows both agreeing on null, doc_3 unmatched."

  - name: amd_null_meta
    description: "attach_metadata over chunk_docs joined against amd_null_meta_source (default in_text=False) — proves a consistently-null metadata value passes through cleanly, no fan-out."
    columns:
      - name: chunk_id
        tests: [unique, not_null]

  - name: amd_null_meta_text
    description: "Same as amd_null_meta with in_text=True — proves a null value renders as an empty line in the prepended block, not a literal null/None string."
    columns:
      - name: chunk_id
        tests: [unique, not_null]

  - name: chunk_metadata_utterances
    description: "attach_metadata over chunk_utterances (transcripts), same macro and call shape as the docs models, pointed at a structurally different source."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: customer
        tests: [not_null]
      - name: participants
        tests: [not_null]
      - name: recording_url
        tests: [not_null]

  - name: chunk_sized
    description: >
      chunk() over the transcript seed at a var-driven target (sized_target_tokens, default 200)
      that every unit fits under. Exists to host no_oversized_chunks: the default target proves
      the test passes on a corpus within budget, and CI re-runs the same test with a target of 3
      to prove it catches an oversized chunk. See the model's own comment for why no existing
      chunking model can serve as the host.
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: exceeds_target
        description: "token_estimate > target_tokens for the chunk."
        tests:
          - dbt_context_engineering.no_oversized_chunks

  - name: chunk_overlap
    description: "chunk output with overlap enabled (target=40, overlap=15)."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: source_rows
        tests: [not_null]

  - name: canary_calibration
    description: "Known-cosine fixtures (0.9999/0.999/0.99/0.95 vs [1,2,3]) for
      canary_cosine_similarity (ADR-0026). assert_canary_calibration_sensitivity asserts both
      numerical correctness and that embedding_canary_similarity_threshold trips where expected,
      on this engine's own implementation."
    columns:
      - name: probe_id
        tests: [unique, not_null]
      - name: expected_similarity
        tests: [not_null]
      - name: observed_similarity
        tests: [not_null]

  - name: chunk_edge_units
    description: >
      Unit fixture for chunk()'s data-shape edge cases: ADR-0002's worked example, an oversized
      unit, a single-unit partition, and null / empty / all-null text.
    columns:
      - name: unit_id
        tests: [unique, not_null]

  - name: chunk_edges
    description: >
      chunk over chunk_edge_units (target=40, overlap=0, no label). Shape pinned exactly in
      assert_chunk_edges; the null-text lineage properties in assert_chunk_null_lineage.
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: chunk_text
        description: "Never null, even for an all-null partition, so a dropped unit is visible."
        tests: [not_null]
      - name: partition_hash
        description: "Always emitted. Folds in chunk_fn_fingerprint, so a config change invalidates it."
        tests: [not_null]
      - name: exceeds_target
        description: "token_estimate > target_tokens. True for a chunk holding an oversized unit."
        tests: [not_null]

  - name: chunk_edges_labeled
    description: >
      Same units and budget as chunk_edges but with label_column set. Exists for the null-text
      case: without a coalesce, `label || ': ' || text` is null and the speaker attribution is
      lost along with the text.
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: chunk_text
        tests: [not_null]

  - name: chunk_delta_units
    description: >
      Two-phase unit fixture (var cd_phase) for the partition-level incremental mechanism.
      Phase 2 grows one partition, shrinks another so a chunk is vacated, and adds a third.
    columns:
      - name: unit_id
        tests: [not_null]

  - name: chunk_delta
    description: >
      chunk materialized incrementally, replacing whole partitions on partition_key (a table on
      BigQuery, which has no correct incremental path for this shape). Asserted in
      assert_chunk_delta across both phases. Not keyed on chunk_id: a re-chunk can renumber or
      drop a partition's chunks, so chunk_id is not a stable identity to merge on.
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: partition_hash
        tests: [not_null]

  - name: attach_metadata_delta_meta_stg
    description: >
      Two-phase metadata fixture (var amd_edit_id) mirroring content_hash_delta_stg's pattern.
      Simulates a metadata-only edit: one document's title changes while chunk_docs' own
      chunk_text (and every other document's title) stays exactly the same.
    columns:
      - name: document_id
        tests: [not_null]

  - name: attach_metadata_delta
    description: >
      attach_metadata materialized incrementally, unique_key=chunk_id, plain merge (no strategy
      override needed: attach_metadata never invents or renumbers chunk_id, so a merge key here
      matches at most one stored row). content_hash is computed inside attach_metadata itself
      from chunk_text plus metadata_columns, not caller-assembled. Asserted in
      assert_attach_metadata_delta across both phases.
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: content_hash
        tests: [not_null]

  - name: kb_delta_tickets_stg
    description: >
      Two-phase source fixture (var kbd_phase) for knowledge_base's per-arm incremental
      mechanism, reusing embeddings' already-paid-for vectors. Phase 2 edits t2's text and
      introduces t3; t1 is untouched.
    columns:
      - name: synth_id
        tests: [not_null]

  - name: kb_delta_calls_stg
    description: >
      Paired with kb_delta_tickets_stg. Never edited across either phase: the whole-untouched-
      source-arm control for assert_kb_delta.
    columns:
      - name: synth_id
        tests: [not_null]

  - name: kb_delta
    description: >
      knowledge_base materialized incrementally, unique_key=source_key, plain merge (no strategy
      override needed: knowledge_base never invents or renumbers source_key, so a merge key here
      matches at most one stored row). source_key (source_type || '::' || source_id) and
      content_hash are computed inside knowledge_base itself, per source arm, before the union,
      not caller-assembled and not an outer wrap-and-filter. Asserted in assert_kb_delta across
      both phases.
    columns:
      - name: source_key
        tests: [unique, not_null]
      - name: content_hash
        tests: [not_null]

  - name: orphan_amd
    description: >
      attach_metadata over orphan_chunks (var-driven target_tokens, same fixture orphan_embeddings
      uses). The relationships test below proves a chunk_id that orphan_chunks stops producing
      after a re-chunk is a loud, testable failure in attach_metadata's own output too, not just
      in a downstream embedding table.
    columns:
      - name: chunk_id
        tests:
          - relationships:
              arguments:
                to: ref('orphan_chunks')
                field: chunk_id

  - name: extract_flat
    description: >
      extract's structured output flattened to scalars. Hosts the grounded generic test, which is
      the wrapper form a consumer writes in their own schema.yml. The assert_extract_grounded
      singular test alongside it checks the same property by calling grounded's internals
      (contains, norm_text, collapse_ws) directly, so the two together cover the internals and
      the wrapper around them.

      allow_empty is true on purpose. A real extract call can legitimately return no evidence for
      an utterance that carries no signal, and grounded's default would fail those rows. That is
      the same line assert_extract_grounded draws, so the two agree on what counts as a
      hallucination rather than disagreeing on live output.
    columns:
      - name: evidence
        tests:
          - dbt_context_engineering.grounded:
              arguments:
                source_text_column: utterance_text
                allow_empty: true

  - name: orphan_kb_source
    description: >
      var-driven row count (ok_include_k3) so this can be rebuilt with a row removed entirely,
      simulating a knowledge_base source deleting a record.
    columns:
      - name: item_id
        tests: [unique, not_null]

  - name: orphan_kb_valid_keys
    description: >
      orphan_kb_source's current rows under knowledge_base's own source_key synthesis
      (source_type || '::' || source_id), so a relationships test has a target to compare against.
    columns:
      - name: source_key
        tests: [unique, not_null]

  - name: orphan_kb
    description: >
      knowledge_base over orphan_kb_source. The relationships test below proves a source_key that
      orphan_kb_source stops producing (a row deleted upstream) is a loud, testable failure, the
      same shape as orphan_amd and orphan_embeddings.
    columns:
      - name: source_key
        tests:
          - relationships:
              arguments:
                to: ref('orphan_kb_valid_keys')
                field: source_key
