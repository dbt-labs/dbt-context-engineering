name: 'databricks_tests'
version: '1.0.0'
config-version: 2

# Live Databricks integration test. Uses the user's ~/.dbt profile 'databricks'.
# RUNS REAL AI CALLS (small cost) once the AI models execute. Requires serverless / DBR 18.2+.
profile: 'databricks'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Databricks Foundation Model endpoints (adjust per workspace availability).
  model_generate: 'databricks-claude-haiku-4-5'
  embedding_model: 'databricks-gte-large-en'
  chunk_target_tokens: 512
  chunk_overlap_tokens: 0
  # Output cap on generate (ai_query max_tokens). No thinking knob on Databricks.
  max_output_tokens: 1024

models:
  dbt_context_engineering:
    +enabled: false
    audit:
      +enabled: true
