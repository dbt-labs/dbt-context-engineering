version: 2

models:
  - name: ce_chunk_metadata_cols_dbx
    description: "ce_attach_metadata over ce_chunk_docs_dbx (default in_text=False) — title/citation_url pass through as columns only."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: ce_chunk_metadata_text_dbx
    description: "ce_attach_metadata over ce_chunk_docs_dbx with in_text=True — same columns, plus the block prepended to chunk_text."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: ce_chunk_metadata_utterances_dbx
    description: "ce_attach_metadata over ce_chunk_utterances_dbx (transcripts), same macro and call shape as the docs models, pointed at a structurally different source."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: customer
        tests: [not_null]
      - name: participants
        tests: [not_null]
      - name: recording_url
        tests: [not_null]
