name: 'duckdb_tests'
version: '1.0.0'
config-version: 2

# Credential-free deterministic test project (ADR-0015). duckdb executes the chunking
# SQL locally so Phase 1 chunking is really validated, not just compiled. Consumes the package
# above as a local dependency.
profile: 'dbt-context-engineering'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Bootstraps ai_run_log once, serially, before any threaded model execution begins. See
# create_ai_run_log_table()'s own docstring for why this can't live inside the package itself
on-run-start:
  - "-- depends_on: {{ ref('ai_run_log') }}\n{{ dbt_context_engineering.create_ai_run_log_table() }}"

vars:
  chunk_target_tokens: 512
  chunk_overlap_tokens: 0

models:
  # The package's own models are disabled here except the audit log (Phase 3) and the
  # embedding_canary monitor, which duckdb exercises for hash/baseline/re-bless plumbing only.
  dbt_context_engineering:
    +enabled: false
    audit:
      +enabled: true
    monitoring:
      +enabled: true

seeds:
  # embedding_canary_baseline ships disabled by default (see root dbt_project.yml) so a
  # consumer's dbt build doesn't seed it unopted; re-enable here since duckdb exercises monitoring.
  dbt_context_engineering:
    +enabled: true
