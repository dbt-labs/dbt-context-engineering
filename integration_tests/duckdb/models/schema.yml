version: 2

models:
  - name: orphan_chunks
    description: >
      chunk output over the synthetic transcript seed, var-driven target_tokens (oc_target_tokens)
      specifically so it can be rebuilt with a different chunking config to simulate a re-chunk.
      See orphan_embeddings and ADR-0023's chunk_id orphaning discussion.
    columns:
      - name: chunk_id
        tests: [unique, not_null]

  - name: orphan_embeddings
    description: >
      Stand-in downstream "embedding" model keyed on chunk_id. The relationships test below is the
      actual point of this fixture: it proves a chunk_id that orphan_chunks stops producing after a
      re-chunk is a loud, testable failure rather than a silent, permanent gap in this table.
    columns:
      - name: chunk_id
        tests:
          - relationships:
              to: ref('orphan_chunks')
              field: chunk_id

  - name: chunk_utterances
    description: "chunk output over the synthetic transcript seed (target_tokens=40)."
    columns:
      - name: chunk_id
        description: "{partition}::{seq} — deterministic, stable."
        tests: [unique, not_null]
      - name: source_rows
        description: "Array of utterance_ids in the chunk (lineage)."
        tests: [not_null]
      - name: chunk_text
        tests: [not_null]
      - name: chunk_seq
        tests: [not_null]

  - name: chunk_overlap
    description: "chunk output with overlap enabled (target=40, overlap=15)."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: source_rows
        tests: [not_null]

  - name: split_docs
    description: "split_sentences over the synthetic document seed (one row per sentence)."
    columns:
      - name: sentence_id
        description: "{document_id}-{sentence_index} — stable unit id for chunk lineage."
        tests: [unique, not_null]
      - name: sentence_index
        tests: [not_null]
      - name: sentence_text
        tests: [not_null]

  - name: chunk_docs
    description: "chunk over split_docs (unit=sentence, target=15) — the split->pack pipeline."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: source_rows
        tests: [not_null]

  - name: render_prompt_test
    description: "prompt + render_prompt validation (prompt assembly)."
    columns:
      - name: rendered_prompt
        tests: [not_null]

  - name: guard_pass
    description: "guard_batch pre-hook passes under default ceilings."
    columns:
      - name: guarded_rows
        tests: [not_null]

  - name: eval_predictions
    description: "Phase 7 golden-set fixture. Clean by construction, so the two evaluation generic
      tests below must pass (their catch-behavior is proven in assert_grounded / assert_conforms)."
    columns:
      - name: example_id
        tests: [unique, not_null]
      - name: evidence
        description: "Each quote is grounded in input_text — grounded asserts it."
        tests:
          - dbt_context_engineering.grounded:
              source_text_column: input_text
      - name: predicted_label
        description: "Must be one of the EXAMPLE_signal_classify v3 taxonomy labels (asserted by
          the assert_conforms singular test, which resolves the enum from schema)."

  - name: eval_metrics
    description: "eval output (accuracy + per-label precision/recall). Values asserted in
      assert_eval_metrics. `value` is intentionally nullable — precision is undefined (null) for a
      label that was never predicted."
    columns:
      - name: metric
        tests: [not_null]
      - name: label
        tests: [not_null]

  - name: chunk_metadata_cols
    description: "attach_metadata over chunk_docs (default in_text=False) — title/citation_url pass through as columns only."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: chunk_metadata_text
    description: "attach_metadata over chunk_docs with in_text=True — same as above, plus the block is prepended to chunk_text."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: canary_calibration
    description: "Known-cosine fixtures (0.9999/0.999/0.99/0.95 vs [1,2,3]) for
      canary_cosine_similarity (ADR-0026). assert_canary_calibration_sensitivity asserts both
      numerical correctness and that embedding_canary_similarity_threshold trips where expected."
    columns:
      - name: probe_id
        tests: [unique, not_null]
      - name: expected_similarity
        tests: [not_null]
      - name: observed_similarity
        tests: [not_null]

  - name: chunk_metadata_utterances
    description: "attach_metadata over chunk_utterances (transcripts, not documents) — same macro and call shape as chunk_metadata_cols, pointed at a structurally different source: customer/participants are frontmatter, recording_url is provenance."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: customer
        tests: [not_null]
      - name: participants
        tests: [not_null]
      - name: recording_url
        tests: [not_null]
