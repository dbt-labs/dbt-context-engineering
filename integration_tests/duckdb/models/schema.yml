version: 2

models:
  - name: ce_chunk_utterances
    description: "ce_chunk output over the synthetic transcript seed (target_tokens=40)."
    columns:
      - name: chunk_id
        description: "{partition}::{seq} — deterministic, stable."
        tests: [unique, not_null]
      - name: source_rows
        description: "Array of utterance_ids in the chunk (lineage)."
        tests: [not_null]
      - name: chunk_text
        tests: [not_null]
      - name: chunk_seq
        tests: [not_null]

  - name: ce_chunk_overlap
    description: "ce_chunk output with overlap enabled (target=40, overlap=15)."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: source_rows
        tests: [not_null]

  - name: ce_split_docs
    description: "ce_split_sentences over the synthetic document seed (one row per sentence)."
    columns:
      - name: sentence_id
        description: "{document_id}-{sentence_index} — stable unit id for ce_chunk lineage."
        tests: [unique, not_null]
      - name: sentence_index
        tests: [not_null]
      - name: sentence_text
        tests: [not_null]

  - name: ce_chunk_docs
    description: "ce_chunk over ce_split_docs (unit=sentence, target=15) — the split->pack pipeline."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: source_rows
        tests: [not_null]

  - name: ce_render_prompt_test
    description: "ce_prompt + ce_render_prompt validation (prompt assembly)."
    columns:
      - name: rendered_prompt
        tests: [not_null]

  - name: ce_guard_pass
    description: "ce_guard_batch pre-hook passes under default ceilings."
    columns:
      - name: guarded_rows
        tests: [not_null]

  - name: ce_chunk_metadata_cols
    description: "ce_attach_metadata over ce_chunk_docs (default in_text=False) — title/citation_url pass through as columns only."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: ce_chunk_metadata_text
    description: "ce_attach_metadata over ce_chunk_docs with in_text=True — same as above, plus the block is prepended to chunk_text."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: ce_chunk_metadata_utterances
    description: "ce_attach_metadata over ce_chunk_utterances (transcripts, not documents) — same macro and call shape as ce_chunk_metadata_cols, pointed at a structurally different source: customer/participants are frontmatter, recording_url is provenance."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: customer
        tests: [not_null]
      - name: participants
        tests: [not_null]
      - name: recording_url
        tests: [not_null]
