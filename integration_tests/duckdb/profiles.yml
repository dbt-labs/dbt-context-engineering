# Local duckdb profile — no credentials, no network. Executes chunking SQL for deterministic tests.
dbt_context_engineering:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'target/tests.duckdb'
      schema: main
      threads: 1
    ci:
      type: duckdb
      path: 'target/tests.duckdb'
      schema: ci_branch
      threads: 1
