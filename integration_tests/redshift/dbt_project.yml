name: 'redshift_tests'
version: '1.0.0'
config-version: 2

# Live Redshift + Amazon Bedrock integration tests (the Redshift analogue of integration_tests/cloud,
# kept separate because Redshift diverges: AI via CREATE EXTERNAL MODEL inference UDFs, best-effort
# structured output, pure-SQL SUPER cosine, and no embedding_canary — see README.md and ADR).
#
# RUNS REAL AI CALLS (small cost) once the AI models execute. Prerequisites, in order:
#   1. Provision the Bedrock inference functions once (run-operation, see README.md):
#        ce_text  (UNIFIED, a current Claude model via a us-* inference profile)
#        ce_embed (RAW, amazon.titan-embed-text-v2:0)
#   2. Run with AI enabled, e.g.:
#        dbt build --project-dir integration_tests/redshift --profile redshift \
#          --vars '{ai_functions_enabled: true}'
# ai_functions_enabled is intentionally NOT set here (safe-by-default, like cloud) — pass it per run.
profile: 'dbt_context_engineering'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Bootstraps ai_run_log once, serially, before any threaded model execution begins (same as the
# cloud/duckdb projects).
on-run-start:
  - "-- depends_on: {{ ref('ai_run_log') }}\n{{ dbt_context_engineering.create_ai_run_log_table() }}"

vars:
  # On Redshift the model vars name the Bedrock inference UDFs (minted by create_bedrock_function),
  # NOT model strings — the model id lives inside the external-model object the UDF wraps.
  model_generate: ce_text          # serves generate / classify / extract / ai_agg
  model_classify: ce_text          # (falls back to model_generate anyway; explicit for clarity)
  model_extract: ce_text
  model_agg: ce_text               # ai_agg on Redshift routes through the text UDF
  embedding_model: ce_embed        # serves embed
  chunk_target_tokens: 512
  chunk_overlap_tokens: 0
  max_output_tokens: 1024          # match cloud; also exercises the UNIFIED maxTokens (camelCase) cap

models:
  # Package's own models disabled except the audit log (Phase 3). monitoring/embedding_canary is
  # deliberately NOT enabled: its scalar-cosine probe is unsupported on Redshift (the dispatched
  # canary macro raises with guidance), so enabling it would fail by design. The embedding_canary
  # baseline seed is likewise left disabled (shipped off by default).
  dbt_context_engineering:
    +enabled: false
    audit:
      +enabled: true
