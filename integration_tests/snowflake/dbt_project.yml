name: 'snowflake_tests'
version: '1.0.0'
config-version: 2

# Live Snowflake (Cortex) integration test. Uses the user's ~/.dbt profile 'jaffle-mcp-demo'.
# This RUNS REAL AI CALLS (small cost) once the AI models are executed.
profile: 'jaffle-mcp-demo'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Cortex models (region-dependent; adjust if unavailable in this account).
  model_generate: 'mistral-large2'  # claude-3-5-sonnet is not available in this account/region
  embedding_model: 'snowflake-arctic-embed-m-v1.5'
  chunk_target_tokens: 512
  chunk_overlap_tokens: 0
  # Output cap on generate (AI_COMPLETE max_tokens). No thinking knob on Cortex.
  max_output_tokens: 1024

models:
  dbt_context_engineering:
    +enabled: false
    audit:
      +enabled: true
