version: 2

models:
  - name: chunk_metadata_cols_sf
    description: "attach_metadata over chunk_docs_sf (default in_text=False) — title/citation_url pass through as columns only."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: chunk_metadata_text_sf
    description: "attach_metadata over chunk_docs_sf with in_text=True — same columns, plus the block prepended to chunk_text."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: citation_url
        tests: [not_null]

  - name: chunk_metadata_utterances_sf
    description: "attach_metadata over chunk_utterances_sf (transcripts), same macro and call shape as the docs models, pointed at a structurally different source."
    columns:
      - name: chunk_id
        tests: [unique, not_null]
      - name: customer
        tests: [not_null]
      - name: participants
        tests: [not_null]
      - name: recording_url
        tests: [not_null]
